name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Verify no hardcoded secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -rnE "(sk-|ghp_|glpat-|xox[bpsar]-|AKIA[A-Z0-9]{16})" src/ examples/ || {
            echo "ERROR: Potential hardcoded secret detected!"
            exit 1
          }
          ! grep -rnE "(ZALO_BOT_TOKEN|ZALO_BOT_SECRET|accessToken|secretKey)\s*[:=]\s*['\"][a-zA-Z0-9_-]{20,}['\"]" src/ examples/ || {
            echo "ERROR: Potential hardcoded credential detected!"
            exit 1
          }
          echo "No hardcoded secrets found."
